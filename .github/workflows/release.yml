name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from GitHub secrets
        shell: pwsh
        run: |
          @"
          VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY
          VITE_ADMIN_SUPABASE_URL=$env:VITE_ADMIN_SUPABASE_URL
          VITE_ADMIN_SUPABASE_ANON_KEY=$env:VITE_ADMIN_SUPABASE_ANON_KEY
          VITE_PROJECT_ID=$env:VITE_PROJECT_ID
          "@ | Out-File -FilePath .env -Encoding utf8
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_SUPABASE_URL: ${{ secrets.VITE_ADMIN_SUPABASE_URL }}
          VITE_ADMIN_SUPABASE_ANON_KEY: ${{ secrets.VITE_ADMIN_SUPABASE_ANON_KEY }}
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}

      - name: Create GitHub release (published)
        shell: bash
        run: |
          # Crea el release ya publicado (draft=false) antes de publicar los
          # assets. Si electron-builder crea el release solo, lo deja como
          # DRAFT y electron-updater lo ignora (no avisa ninguna actualización).
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --draft=false \
              --prerelease=false \
              --title "CantoBar POS ${GITHUB_REF_NAME}" \
              --notes "Release automático de CantoBar POS."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:win:publish

